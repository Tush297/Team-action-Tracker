name: Excel to GitHub Issues Sync

on:
  repository_dispatch:
    types: [excel_sync]

permissions:
  issues: write
  contents: read

jobs:
  create_issue:
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const payload = context.payload.client_payload;

            const title = payload.title || "Untitled Task";

            const body =
              "Task ID: " + (payload.task_id || "N/A") + "\n" +
              "Owner: " + (payload.owner || "N/A") + "\n" +
              "Status: " + (payload.status || "N/A") + "\n" +
              "Start Date: " + (payload.start_date || "N/A") + "\n" +
              "ETA: " + (payload.eta || "N/A") + "\n" +
              "Last Updated: " + (payload.last_updated || "N/A") + "\n\n" +
              "Description:\n" +
              (payload.description || "No description provided");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body
            });
