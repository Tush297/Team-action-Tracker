name: Excel to GitHub Issues Sync

on:
  repository_dispatch:
    types: [excel_sync]

permissions:
  issues: write
  contents: read

jobs:
  create_or_update_issue:
    runs-on: ubuntu-latest

    steps:
      - name: Create or Update Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const payload = context.payload.client_payload;

            // 🚫 Skip empty rows
            if (!payload.title || payload.title.trim() === "") {
              console.log("Skipping empty row...");
              return;
            }

            if (!payload.row_key || payload.row_key.trim() === "") {
              console.log("Skipping invalid row key...");
              return;
            }

            const title = payload.title;
            const rowKey = payload.row_key;

            const body =
              "ROW_KEY: " + rowKey + "\n" +
              "Owner: " + (payload.owner || "N/A") + "\n" +
              "Status: " + (payload.status || "N/A") + "\n\n" +
              "Description:\n" +
              (payload.description || "No description provided");

            let issues = [];

            // 🔍 Fetch ALL issues
            try {
              issues = await github.paginate(
                github.rest.issues.listForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: "open",
                  per_page: 100
                }
              );
            } catch (error) {
              console.log("Issue fetch failed, continuing...");
            }

            // 🔍 Match logic (IMPORTANT: supports old + new)
            const existing = issues.find(issue => {
              if (!issue.body) return false;

              return (
                issue.body.includes("ROW_KEY: " + rowKey) ||   // new system (task_id)
                issue.title === title                          // fallback for old issues
              );
            });

            if (existing) {
              // 🔁 Update existing issue
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  title: title,
                  body: body
                });
                console.log(`Updated issue #${existing.number}`);
              } catch (err) {
                console.log("Update failed, skipping...");
              }
            } else {
              // 🆕 Create new issue
              try {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: body
                });
                console.log(`Created issue #${created.data.number}`);
              } catch (err) {
                console.log("Create failed, skipping...");
              }
            }
