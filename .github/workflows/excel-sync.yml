name: Excel to GitHub Issues Sync

on:
  repository_dispatch:
    types: [excel_sync]

permissions:
  issues: write
  contents: read

jobs:
  create_or_update_issue:
    runs-on: ubuntu-latest

    steps:
      - name: Create or Update Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const payload = context.payload.client_payload;

            const title = payload.title || "Untitled Task";
            const rowKey = payload.row_key || "";

            const body =
              "ROW_KEY: " + rowKey + "\n" +
              "Owner: " + (payload.owner || "N/A") + "\n" +
              "Status: " + (payload.status || "N/A") + "\n\n" +
              "Description:\n" +
              (payload.description || "No description provided");

            let existing = null;

            // 🔍 Step 1: Search existing issue using ROW_KEY (NO LIMIT ISSUE)
            try {
              const response = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} "${rowKey}" in:body`
              });

              if (response.data.items.length > 0) {
                existing = response.data.items[0];
              }
            } catch (error) {
              console.log("Search failed, continuing...");
            }

            if (existing) {
              // 🔁 Update existing issue
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  title: title,
                  body: body
                });
                console.log(`Updated issue #${existing.number}`);
              } catch (err) {
                console.log("Update failed, skipping...");
              }
            } else {
              // 🆕 Create new issue
              try {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: body
                });
                console.log(`Created issue #${created.data.number}`);
              } catch (err) {
                console.log("Create failed, skipping...");
              }
            }
