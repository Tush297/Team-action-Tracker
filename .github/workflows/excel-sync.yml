name: Excel to GitHub Issues Sync

on:
  repository_dispatch:
    types: [excel_sync]

permissions:
  issues: write
  contents: read

jobs:
  create_or_update_issue:
    runs-on: ubuntu-latest

    steps:
      - name: Create or Update Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const payload = context.payload.client_payload;

            const title = payload.title || "Untitled Task";
            const rowKey = payload.row_key || "";

            const body =
              "ROW_KEY: " + rowKey + "\n" +
              "Owner: " + (payload.owner || "N/A") + "\n" +
              "Status: " + (payload.status || "N/A") + "\n\n" +
              "Description:\n" +
              (payload.description || "No description provided");

            let issues = [];

            // 🔍 Step 1: Get existing issues (SAFE)
            try {
              const response = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                per_page: 30
              });
              issues = response.data;
            } catch (error) {
              console.log("Issue fetch failed, continuing...");
            }

            // 🔍 Step 2: Find existing issue using ROW_KEY
            const existing = issues.find(issue =>
              issue.body && issue.body.includes("ROW_KEY: " + rowKey)
            );

            if (existing) {
              // 🔁 Update existing issue (SAFE)
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  title: title,
                  body: body
                });
              } catch (err) {
                console.log("Update failed, skipping...");
              }
            } else {
              // 🆕 Create new issue (SAFE)
              try {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: body
                });
              } catch (err) {
                console.log("Create failed, skipping...");
              }
            }
