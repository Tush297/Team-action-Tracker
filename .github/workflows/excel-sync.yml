name: Excel to GitHub Issues Sync

on:
  repository_dispatch:
    types: [excel_sync]

permissions:
  issues: write
  contents: read

jobs:
  create_or_update_issue:
    runs-on: ubuntu-latest

    steps:
      - name: Create or Update GitHub Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            const payload = context.payload.client_payload || {};

            const title = payload.title || "Untitled Task";
            const owner = payload.owner || "";

            const body =
              "Owner: " + (payload.owner || "N/A") + "\n" +
              "Status: " + (payload.status || "N/A") + "\n" +
              "Start Date: " + (payload.start_date || "N/A") + "\n" +
              "ETA: " + (payload.eta || "N/A") + "\n" +
              "Last Updated: " + (payload.last_updated || "N/A") + "\n\n" +
              "Description:\n" +
              (payload.description || "No description provided");

            // 🔍 Get existing issues
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            // 🔍 Find issue by title (avoid duplicates)
            const existing = issues.data.find(issue =>
              issue.title === title
            );

            let issueNumber;

            if (existing) {
              console.log(`Updating issue #${existing.number}`);

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title: title,
                body: body
              });

              issueNumber = existing.number;

            } else {
              console.log("Creating new issue");

              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body
              });

              issueNumber = created.data.number;
            }

            // 🏷️ Auto-label for team tasks
            if (owner.toLowerCase().includes("team")) {
              console.log("Adding Team label");

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ["Team"]
              });
            }
